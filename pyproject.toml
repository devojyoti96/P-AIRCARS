[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paircars"
version = "3.0.0"
description = "A package to calibrate and image MWA solar observation"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
authors = [
  {name = "Devojyoti Kansabanik", email = "devojyoti96@gmail.com"}
]
requires-python = ">=3.10,<3.11"
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy"
]
dependencies = ["MarkupSafe==3.0.2", "PyQt5_sip==12.18.0", "PyYAML==6.0.1", "Unidecode==1.3.8", "aiapy==0.10.1", "aioftp==0.23.1", "aiohttp==3.10.10", "aiosignal==1.3.1", "anyio==4.12.1", "asciitree==0.3.3", "asdf==5.1.0", "asdf-astropy==0.7.1", "asdf_standard==1.5.0", "asgi-lifespan==2.1.0", "astropy==6.1.4", "astropy-iers-data==0.2024.10.28.0.34.7", "async-timeout==4.0.3", "backports.tarfile==1.2.0", "cachetools==6.2.6", "casadata==2024.5.22", "casatasks==6.6.0.20", "casatools==6.6.0.20", "cdflib==1.3.8", "certifi==2024.7.4", "cffi==2.0.0", "charset-normalizer==3.4.1", "click==8.1.7", "configparser==7.1.0", "coolname==2.2.0", "cycler==0.12.1", "dask==2024.7.1", "dask-jobqueue==0.9.0", "dateparser==1.3.0", "distributed==2024.7.1", "donfig==0.8.1.post1", "drms==0.8.0", "frozenlist==1.5.0", "h11==0.16.0", "h2==4.3.0", "h5netcdf==1.6.1", "h5py==3.13.0", "hpack==4.1.0", "html5lib==1.1", "hyperframe==6.1.0", "importlib_metadata==8.2.0", "isodate==0.7.2", "jaraco.classes==3.4.0", "jaraco.context==6.1.1", "jaraco.functools==4.4.0", "jaraco.text==4.0.0", "joblib==1.4.2", "jplephem==2.24", "jsonpointer==3.0.0", "julian==0.14", "kiwisolver==1.4.5", "locket==1.0.0", "lxml==5.4.0", "matplotlib==3.5.2", "msgpack==1.1.0", "multidict==6.1.0", "numcodecs==0.13.1", "numexpr==2.14.1", "paircars==3.0.0", "parfive==2.1.0", "pillow==10.4.0", "prefect-dask==0.3.6", "prometheus_client==0.24.1", "propcache==0.2.0", "psutil==5.9.8", "pyerfa==2.0.1.4", "pyfiglet==1.0.4", "python-dateutil==2.9.0.post0", "python-dotenv==1.1.1", "python-slugify==8.0.4", "python-socks==2.8.1", "pytz==2024.2", "regex==2026.2.28", "requests==2.32.3", "requests-file==2.1.0", "rfc3339-validator==0.1.4", "semantic-version==2.10.0", "setuptools==82.0.1", "six==1.16.0", "sniffio==1.3.1", "sortedcontainers==2.4.0", "sunpy==6.0.5", "tblib==3.0.0", "toml==0.10.2", "toolz==0.12.1", "tornado==6.4.2", "tqdm==4.66.6", "tzdata==2024.2", "tzlocal==5.3.1", "watchdog==6.0.0", "webencodings==0.5.1", "websockets==15.0.1", "xarray==2025.1.2", "yarl==1.17.1", "zarr==2.18.3", "zeep==4.3.1", "zict==3.0.0", "zipp==3.19.2"]
urls = {"Homepage" = "https://github.com/devojyoti96/P-AIRCARS"}

[project.optional-dependencies]
dev = [
  "sphinx>=7.2.6",
  "furo>=2024.5.6",
  "sphinx_rtd_theme>=2.0.0",
  "sphinx-autodoc-typehints>=2.0.0",
  "sphinx-copybutton>=0.5.2",
  "sphinxcontrib-programoutput>=0.17",
  "sphinx-togglebutton>=0.3.2",
  "myst-parser>=2.0.0",
  "sphinxcontrib-apidoc>=0.4.0",
  "sphinx-automodapi>=0.15.0",
  "numpydoc>=1.6.0",
  "sphinxcontrib-mermaid>=0.9.2",
  "graphviz>=0.20.3",
  "sphinx-autobuild>=2021.3.14",
  "pytest==8.3.3",
  "pytest-mock>=3.14.0",
  "pytest-asyncio",
  "ruff",
  "black",
]
[project.scripts]
run-mwa-basic-cal = "paircars.pipeline.basic_cal:cli"
run-mwa-apply-basiccal = "paircars.pipeline.do_apply_basiccal:cli"
run-mwa-apply-selfcal = "paircars.pipeline.do_apply_selfcal:cli"
run-mwa-split = "paircars.pipeline.do_target_split:cli"
run-mwa-flag = "paircars.pipeline.flagging:cli"
run-mwa-import-model = "paircars.pipeline.import_model:cli"
run-mwa-selfcal = "paircars.pipeline.do_selfcal:cli"
run-mwa-imaging = "paircars.pipeline.do_imaging:cli"
run-mwa-singlepbcor = "paircars.pipeline.single_image_mwapbcor:cli"
run-mwa-pbcor = "paircars.pipeline.mwa_pbcor:cli"
run-mwa-mwalogger = "paircars.pipeline.viewer:cli"
run-mwa-euvoverlay = "paircars.pipeline.make_mwa_overlay:cli"
run-mwa-msplot = "paircars.pipeline.make_ms_plot:cli"
run-mwa-movetosun = "paircars.pipeline.move_solarcenter:cli"
run-mwa-makeds = "paircars.pipeline.mwa_make_ds:cli"
run-mwa-solar-siderealcor = "paircars.pipeline.do_sidereal_cor:cli"
run-mwa-fill-caltable = "paircars.casacoreutils.fill_caltable:cli"
run-mwa-beam-interpolate = "paircars.pipeline.beam_interpolate:cli"
run-mwa-masterflow = "paircars.pipeline.master_flow:cli"
run-mwa-paircars = "paircars.pipeline.run_paircars:cli"
init-paircars-setup = "paircars.pipeline.init_data:cli"
init-paircars-prefect = "paircars.pipeline.prefect_server:cli"
kill-paircars-job = "paircars.pipeline.kill_job:kill_paircarsjob"
show-paircars-ms = "paircars.pipeline.show_msdetails:cli"
show-paircars-status = "paircars.pipeline.show_status:cli"

[tool.setuptools]
packages = [
  "paircars",
  "paircars.utils",
  "paircars.casacoreutils",
  "paircars.clusterutils",
  "paircars.pipeline",
  "paircars.data"
]
include-package-data = true

[tool.setuptools.package-data]
"paircars.data" = ["sendmail.so"]
